<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GĐ5 Smoke Test — Dashboard & Thống kê</title>
<style>
body{font-family:Arial,sans-serif;max-width:1120px;margin:20px auto;padding:0 12px;background:#f6f7f9;color:#1f2937}
h1{font-size:23px}.card{background:#fff;border:1px solid #d9dee7;border-radius:10px;padding:14px;margin:12px 0}
input,select,button{font:inherit;padding:8px;margin:4px 2px}input[type=text],input[type=password]{min-width:300px;max-width:96%}
button{cursor:pointer;border:1px solid #9ca3af;border-radius:7px;background:#fff}button:hover{background:#f0f2f5}
.good{color:#087b37;font-weight:700}.bad{color:#b42318;font-weight:700}.small{font-size:13px;color:#4b5563}
pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;max-height:620px;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<h1>GĐ5 — Smoke Test Dashboard, thống kê & biểu đồ</h1>
<p class="small">Chỉ đọc dữ liệu. Token chỉ giữ trong RAM của trang; mật khẩu/token không hiển thị trong kết quả.</p>

<div class="card">
<b>Web App TEST</b><br>
<input id="url" type="text" value="https://script.google.com/macros/s/AKfycby9nG75xkqsUjbGkUc64urrLtmE4kQedN9RkZgZ1qCUAaIT6_cM2nScHLyKoH8-x4je/exec">
<button onclick="health()">1. healthCheck</button>
<button onclick="publicDash()">2. getPublicDashboard</button>
</div>

<div class="card">
<b>Unit AREA_001</b><br>
<input id="unitLogin" type="text" value="AREA_001_01">
<input id="unitPass" type="password" placeholder="Mật khẩu Unit hiện tại">
<div class="row">
<button onclick="loginUnit()">3. loginUnit</button>
<button onclick="unitDashboard()">4. unitGetDashboard</button>
<button onclick="dashPeriods()">5. getDashboardPeriodOptions BM2</button>
<button onclick="unitReports()">6. getReports BM2</button>
<button onclick="unitCompare()">7. getComparisonData c02</button>
<button onclick="unitChart()">8. AREA_COMPARE c02</button>
</div>
<span id="unitState" class="small">Chưa đăng nhập.</span>
</div>

<div class="card">
<b>Admin / Superadmin</b><br>
<input id="adminLogin" type="text" value="Admin">
<input id="adminPass" type="password" placeholder="Mật khẩu Admin hiện tại">
<div class="row">
<button onclick="loginAdmin()">9. loginAdmin</button>
<button onclick="adminDashboard()">10. adminGetDashboard</button>
<button onclick="missing()">11. getMissingReports BM2</button>
<button onclick="adminReports()">12. getReports toàn quyền</button>
<button onclick="pie()">13. PIE_SUBMISSION_STATUS</button>
<button onclick="logs()">14. adminGetLogs</button>
</div>
</div>

<div class="card">
<b>Kiểm thử âm tính</b>
<div class="row">
<button onclick="unitCallsAdmin()">N1. Unit → adminGetDashboard</button>
<button onclick="missingAggregation()">N2. getMissingReports kỳ tổng hợp Q3</button>
<button onclick="invalidChart()">N3. chart_type sai</button>
</div>
</div>

<div class="card">
<div><b>Kết quả:</b> <span id="status">Chưa chạy.</span></div>
<pre id="out">Chưa chạy.</pre>
</div>

<script>
const S={unitToken:'',adminToken:''};
function rid(p='GD5'){return 'REQ_'+p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,10)}
function url(){return document.getElementById('url').value.trim()}
function safe(x){
 const secret=/password|token|hash|salt|pepper/i;
 function walk(v,k=''){if(secret.test(k))return '[HIDDEN]';if(Array.isArray(v))return v.map(a=>walk(a));if(v&&typeof v==='object'){const o={};Object.keys(v).forEach(key=>o[key]=walk(v[key],key));return o}return v}
 return walk(x)
}
function show(label,res,expect){
 const ok=expect?expect(res):!!res?.ok, st=document.getElementById('status');
 st.className=ok?'good':'bad';st.textContent=(ok?'PASS — ':'CHECK — ')+label;
 document.getElementById('out').textContent=JSON.stringify(safe(res),null,2)
}
async function api(action,payload={},opt={}){
 const req={action,request_id:opt.request_id||rid(action),token:opt.token||'',portal:opt.portal||'',payload,client_info:{source:'GD5_SMOKE_TEST_20260827',page_origin:location.origin}};
 try{const r=await fetch(url(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req)});const t=await r.text();try{return JSON.parse(t)}catch(e){return {ok:false,errorCode:'NON_JSON',message:t.slice(0,1500)}}}
 catch(e){return {ok:false,errorCode:'FETCH_ERROR',message:String(e)}}
}
async function health(){const r=await api('healthCheck');show('healthCheck GĐ5',r,x=>x.ok&&x.data?.schemaOk===true&&String(x.data?.deploymentVersion||'').includes('GD5_DASHBOARD_STATISTICS'))}
async function publicDash(){const r=await api('getPublicDashboard');const s=JSON.stringify(r);show('getPublicDashboard',r,x=>x.ok&&!!x.data?.app_name&&!/password_hash|token_hash|before_json|after_json/.test(s)&&!Array.isArray(x.data?.missing))}
async function loginUnit(){const r=await api('loginUnit',{login_input:document.getElementById('unitLogin').value,password:document.getElementById('unitPass').value},{portal:'unit_portal'});if(r.ok&&r.data?.token){S.unitToken=r.data.token;document.getElementById('unitState').textContent='Unit token đã lưu RAM.'}show('loginUnit',r,x=>x.ok&&!!x.data?.token&&x.data?.must_change_password===false)}
async function unitDashboard(){const r=await api('unitGetDashboard',{},{token:S.unitToken,portal:'unit_portal'});show('unitGetDashboard',r,x=>x.ok&&x.data?.profile?.area_id==='AREA_001'&&Array.isArray(x.data?.current_periods)&&x.data?.scope?.area_ids?.length===1)}
async function dashPeriods(){const r=await api('getDashboardPeriodOptions',{form_code:'BM2'},{token:S.unitToken,portal:'unit_portal'});show('getDashboardPeriodOptions',r,x=>x.ok&&Array.isArray(x.data?.periods)&&x.data.periods.length>0&&x.data.periods.every(p=>p.is_aggregation_period===true))}
async function unitReports(){const r=await api('getReports',{form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.unitToken,portal:'unit_portal'});show('getReports unit',r,x=>x.ok&&x.data?.total===1&&x.data?.reports?.[0]?.area_id==='AREA_001'&&x.data?.reports?.[0]?.revision===2)}
async function unitCompare(){const r=await api('getComparisonData',{form_code:'BM2',field_key:'c02',period_type:'MONTH',period_key:'2026-09'},{token:S.unitToken,portal:'unit_portal'});show('getComparisonData unit',r,x=>x.ok&&Array.isArray(x.data?.comparison_rows)&&x.data.comparison_rows.length===1&&x.data.comparison_rows[0].area_id==='AREA_001'&&x.data.comparison_rows[0].previous_available===false&&x.data.comparison_rows[0].previous_value===null)}
async function unitChart(){const r=await api('getChartsData',{chart_type:'AREA_COMPARE',form_code:'BM2',field_key:'c02',period_type:'MONTH',period_key:'2026-09'},{token:S.unitToken,portal:'unit_portal'});show('AREA_COMPARE unit',r,x=>x.ok&&x.data?.labels?.length===1&&x.data?.datasets?.[0]?.data?.[0]===1)}
async function loginAdmin(){const r=await api('loginAdmin',{login_input:document.getElementById('adminLogin').value,password:document.getElementById('adminPass').value},{portal:'admin_portal'});if(r.ok&&r.data?.token)S.adminToken=r.data.token;show('loginAdmin',r,x=>x.ok&&!!x.data?.token&&x.data?.must_change_password===false)}
async function adminDashboard(){const r=await api('adminGetDashboard',{form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.adminToken,portal:'admin_portal'});show('adminGetDashboard',r,x=>x.ok&&x.data?.scope?.area_count===64&&x.data?.submission?.reported_count>=1)}
async function missing(){const r=await api('getMissingReports',{form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.adminToken,portal:'admin_portal'});show('getMissingReports',r,x=>x.ok&&x.data?.total_scope===64&&x.data?.reported_count===1&&x.data?.missing_count===63)}
async function adminReports(){const r=await api('getReports',{form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.adminToken,portal:'admin_portal'});show('getReports admin',r,x=>x.ok&&x.data?.total===1&&x.data?.reports?.[0]?.revision===2)}
async function pie(){const r=await api('getChartsData',{chart_type:'PIE_SUBMISSION_STATUS',form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.adminToken,portal:'admin_portal'});show('PIE_SUBMISSION_STATUS',r,x=>x.ok&&x.data?.labels?.length===5&&x.data?.datasets?.[0]?.data?.reduce((a,b)=>a+b,0)===64)}
async function logs(){const r=await api('adminGetLogs',{form_code:'BM2',limit:20,include_json:true},{token:S.adminToken,portal:'admin_portal'});const s=JSON.stringify(r);show('adminGetLogs',r,x=>x.ok&&x.data?.sensitive_fields_masked===true&&Array.isArray(x.data?.logs)&&!/password_hash|token_hash/.test(s))}
async function unitCallsAdmin(){const r=await api('adminGetDashboard',{form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.unitToken,portal:'unit_portal'});show('Unit → adminGetDashboard',r,x=>x.ok===false&&(x.errorCode==='WRONG_PORTAL'||x.errorCode==='FORBIDDEN'))}
async function missingAggregation(){const r=await api('getMissingReports',{form_code:'BM2',period_type:'QUARTER',period_key:'2026-Q3'},{token:S.adminToken,portal:'admin_portal'});show('missing on aggregation period',r,x=>x.ok===false&&x.errorCode==='INVALID_REQUEST')}
async function invalidChart(){const r=await api('getChartsData',{chart_type:'BAD_CHART',form_code:'BM2',period_type:'MONTH',period_key:'2026-09'},{token:S.adminToken,portal:'admin_portal'});show('invalid chart_type',r,x=>x.ok===false&&x.errorCode==='INVALID_REQUEST')}
</script>
</body>
</html>
